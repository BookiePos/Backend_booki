name: CI — gates del backend

# Corre los mismos gates que `node scripts/gates.mjs` en local (tsc código y tests contra
# sus techos, vitest, eslint contra su techo, secretos en todo el árbol) más `pnpm build`.
# En un PR, además, revisa que las líneas añadidas respecto a la rama base no traigan secretos.
# NO despliega.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Historial completo: `--desde origin/<base>` necesita la base de fusión.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Gates (con build)
        run: node scripts/gates.mjs --build

      # Ítem 4.10: techo de 0 críticas y 0 altas en las dependencias de
      # producción. Las moderadas sin parche quedan anotadas en el checklist.
      - name: Auditoría de dependencias (prod, alta o crítica falla)
        run: pnpm audit --prod --audit-level high

      - name: Secretos en las líneas añadidas del PR
        if: github.event_name == 'pull_request'
        run: node scripts/check-no-secrets.mjs --desde origin/${{ github.base_ref }}

  # Ítem 5.8: integración contra un Mongo real (mongodb-memory-server), aparte de
  # los gates porque baja y arranca un mongod. Tenancy e idempotencia del ledger.
  integracion:
    name: Integración (Mongo real)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache del binario de mongod
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Pruebas de integración
        run: pnpm test:integracion
